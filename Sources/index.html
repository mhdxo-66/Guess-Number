<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="./Guess-Number.png">
        <link rel="stylesheet" href="styles.css">
        <script src="scripts.js" defer></script>
        <title>Guess Number</title>
    </head>

    <body>
        <header>
            <p class="note">(Between 1 and 20)</p>
            <h1>Guess My Number!</h1>
        </header>
        <p id="rule">
            --------------------
            <span class="ans">?</span>
            --------------------
        </p>
        <br>
        <div id="stat">
        <section>
            <form class="form">
                <input type="number" class="numes" min="1" max="20" required><br>
                <button class="chk">Check</button>
            </form>
        </section>
        <section>
            <h2 class="status">Start Guessing...</h2>
            <br>
            <p class="score"></p>
            <p class="hscore">
        </section>
    </div>
    </body>

</html>
