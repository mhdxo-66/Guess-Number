<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <script src="scripts.js" defer></script>
        <title>Guess Number</title>
    </head>

    <body>
        <p class="note">(Between 1 and 20)</p>
        <h1>Guess My Number!</h1>
        <hr class="line">
        <p class="ans">?</p>
        <br><br>
        <div>
            <form class="form">
                <input type="number" class="numes" min="1" max="20" required><br>
                <button class="chk">Check</button>
            </form>
            <section class="stn2">
                <h2 class="h2">Start Guessing...</h2>
                <br>
                <p class="score">💯 Score : 20</p>
                <p class="hscore">🥇 Highscore : 0</p>
            </section>
        </div>
    </body>

</html>
