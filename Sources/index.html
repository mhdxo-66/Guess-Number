<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
    <title>Guess Number</title>
</head>

<body>
    <button class="btag">Again!</button>
    <p class="btw">(Between 1 and 20)</p>
    <h1>Guess My Number!</h1>
    <hr class="line">
    <p class="ans">?</p>
    </hr>
    <br><br>
    <form>
        <input type="number" class="numes" min="1" max="20" required><br>
        <button type="submit" class="chk">Check</button>
    </form>
    <section>
        <h2 class="h2"></h2>
        <br><br><br>
        <p class="score"></p>
        <br>
        <p class="hscore"></p>
    </section>
</body>

</html>
